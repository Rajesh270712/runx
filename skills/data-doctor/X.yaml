skill: data-doctor
version: "0.1.0"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical
  runtime_path: local

harness:
  cases:
    - name: data-doctor-customer-health-report
      runner: analyze
      inputs:
        dataset: fixtures/customer-health-dataset.json
        schema: fixtures/customer-health-schema.json
        quality_rules: fixtures/customer-health-rules.json
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed
          reason_code: process_closed
    - name: data-doctor-malformed-rows-refused
      runner: analyze
      inputs:
        dataset: fixtures/malformed-rows-dataset.json
        schema: fixtures/customer-health-schema.json
        quality_rules: fixtures/customer-health-rules.json
      expect:
        status: failure
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: failed
          reason_code: process_failed

runx:
  mutating: false
  idempotency:
    key: dataset_sha256
  scopes:
    - dataset.fixture.read
    - schema.fixture.read
  policy:
    data_classification: bounded_public_fixture
    reads:
      - package-relative dataset fixtures
      - package-relative schema fixtures
      - package-relative quality-rule fixtures
    writes: []
    disallows:
      - dataset mutation
      - unbounded export
      - private customer data
      - invented columns or causes
    verifier_notes:
      - Findings are computed only from supplied rows, schema fields, and quality rules.
      - The malformed fixture fails closed before any quality report is emitted.
  artifacts:
    emits:
      - metrics
      - findings
      - recommendations
      - report
    wrap_as: data_doctor_packet

runners:
  analyze:
    default: true
    type: cli-tool
    command: /usr/bin/env
    args:
      - node
      - run.mjs
    scopes:
      - dataset.fixture.read
      - schema.fixture.read
    policy:
      reads:
        - bounded dataset fixtures
        - declared schema fixtures
        - declared quality rules
      writes: []
      disallows:
        - mutating dataset rows
        - reading outside the skill directory
        - fetching live data
        - processing private customer data
    outputs:
      metrics: object
      findings: array
      recommendations: array
      report: string
    artifacts:
      wrap_as: data_doctor_packet
      packet: runx.data_doctor.report.v1
    inputs:
      dataset:
        type: json
        required: true
        description: Dataset object or package-relative JSON fixture path. Must include rows array.
      schema:
        type: json
        required: true
        description: Schema object or package-relative JSON fixture path. Must include fields with name and type.
      quality_rules:
        type: json
        required: true
        description: Quality rule object or package-relative JSON fixture path.
